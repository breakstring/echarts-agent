services:
  echarts-agent:
    image: ${ECHARTS_AGENT_IMAGE:?Set ECHARTS_AGENT_IMAGE to a GHCR version or digest}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2
    pids_limit: 128
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
